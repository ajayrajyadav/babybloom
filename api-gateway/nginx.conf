worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /opt/homebrew/etc/nginx/mime.types;
    sendfile on;

    server {
        listen 8080;
        server_name localhost;

        client_max_body_size 50M;

        # Enable CORS
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;

        # Route user registration & login
        location /api/users/register {
            proxy_pass http://localhost:5001/users/register;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/users/login {
            proxy_pass http://localhost:5001/users/login;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Forward other user-related API calls
        location /api/users/ {
            proxy_pass http://localhost:5001/users/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization "Bearer 05c73ebd3a88e2b93a9bc70b9b9bdeceafbcea74cd2a0de1928cac876022e09e79fb3d2c382aebb2edf74b342bf1ba397681f692fc8f68d88bd087b8f3c36c71";
        }

        location /api/babies/ {
            proxy_pass http://localhost:5002;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        error_log /opt/homebrew/var/log/nginx/babybloom_error.log;
        access_log /opt/homebrew/var/log/nginx/babybloom_access.log;
    }
}