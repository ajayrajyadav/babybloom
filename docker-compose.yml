version: '3.8'

services:
  mongodb:
    image: mongo:6.0 # Compatible with Apple Silicon
    container_name: babybloom-mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: babybloom
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
    driver: local